apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadata
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels: { app: metadata }
  template:
    metadata:
      labels: { app: metadata }
    spec:
      containers:
        - name: mock
          image: public.ecr.aws/aws-ec2/amazon-ec2-metadata-mock:v1.13.0
          ports:
            - containerPort: 1338
