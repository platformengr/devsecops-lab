apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: checkout-signed-by-release
spec:
  validationActions: [Deny]
  matchImageReferences:
    - glob: "ghcr.io/OWNER/devsecops-lab/checkout*"
  attestors:
    - name: release
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subject: https://github.com/OWNER/devsecops-lab/.github/workflows/release.yml@refs/heads/main
