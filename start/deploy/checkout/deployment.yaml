apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: checkout-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      serviceAccountName: checkout
      automountServiceAccountToken: false
      containers:
        - name: checkout
          image: checkout:lab
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
