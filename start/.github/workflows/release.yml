name: release
on:
  push:
    tags: ['v*']
permissions: {}
jobs:
  release:
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: app/node_modules
          key: app-${{ hashFiles('app/package-lock.json') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/checkout:latest
